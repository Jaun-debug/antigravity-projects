<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Owner Rates — Namibia Rates</title>
<style>
  :root{
    --gold:#B8956A; --gold-dk:#9c7b52; --green:#87a996; --green-dk:#6d8d7b;
    --blue:#2f6fd0; --bone:#F5F1E8; --card:#fffdf8; --ink:#2f2b25; --muted:#8a8175;
    --line:#e6ded0; --danger:#c0603f; --shadow:0 1px 3px rgba(60,50,35,.09);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bone);color:var(--ink);font-size:15px;line-height:1.4}
  a{color:var(--gold-dk)}
  h1,h2,h3{font-weight:600;margin:0}
  button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--gold);color:#fff;box-shadow:var(--shadow)}
  button:hover{background:var(--gold-dk)}
  button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
  button.ghost:hover{background:#faf6ee}
  button.green{background:var(--green)} button.green:hover{background:var(--green-dk)}
  button.danger{background:#fff;color:var(--danger);border:1px solid #e7c6ba;box-shadow:none}
  button.danger:hover{background:#fbeee9}
  button.sm{padding:5px 9px;font-size:13px;border-radius:6px}
  input,textarea,select{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#fff;width:100%}
  input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:-1px}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 3px 2px;letter-spacing:.02em;text-transform:uppercase}
  .wrap{max-width:1080px;margin:0 auto;padding:18px}
  #login{max-width:380px;margin:9vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;box-shadow:var(--shadow)}
  #login h1{font-size:20px;margin-bottom:4px}
  #login p{color:var(--muted);font-size:13px;margin:0 0 18px}
  .brandbar{height:5px;background:linear-gradient(90deg,var(--gold),var(--green));border-radius:14px 14px 0 0;margin:-26px -26px 20px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line)}
  header.top .lhs{display:flex;align-items:center;gap:10px}
  .dot{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--gold),var(--green))}
  .layout{display:grid;grid-template-columns:290px 1fr;gap:18px}
  @media(max-width:760px){.layout{grid-template-columns:1fr}}
  .side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow);align-self:start}
  .side .search{margin-bottom:10px}
  .modeSwitch{display:flex;gap:6px;margin-bottom:10px;background:#f1ece2;padding:4px;border-radius:9px}
  .ms{flex:1;background:transparent;color:var(--muted);box-shadow:none;border-radius:7px;padding:8px 6px;font-size:13px;font-weight:600}
  .ms.active{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
  .ms[data-mode="sto"].active{color:var(--green-dk)}
  .navsel{margin-bottom:8px}
  .lodge{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 9px;border-radius:8px;cursor:pointer}
  .lodge:hover{background:#f6f1e7}
  .lodge:hover .nm{color:var(--green)}
  .lodge.active{background:#efe7d7}
  .lodge .nm{font-weight:500;font-size:14px;transition:color .12s}
  .lodge .rg{font-size:11px;color:var(--muted)}
  .grouphdr{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 6px 4px;font-weight:700;transition:color .12s}
  .grouphdr:hover{color:var(--green)}
  .mk{font-size:14px;color:#d7cfbf;width:20px;display:inline-block;text-align:center;flex:none}
  .mk.rk.on{color:var(--green)}
  .mk.st.on{color:var(--blue)}
  .main{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);min-height:60vh}
  .empty{color:var(--muted);text-align:center;padding:60px 20px}
  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}
  .tab{padding:9px 16px;border-radius:8px 8px 0 0;background:transparent;color:var(--muted);box-shadow:none}
  .tab:hover{background:#f6f1e7;color:var(--ink)}
  .tab.active{background:#efe7d7;color:var(--ink);font-weight:600}
  .metagrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
  @media(max-width:620px){.metagrid{grid-template-columns:1fr}}
  .section{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;background:#fffdf9}
  .section .shead{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .row{display:grid;grid-template-columns:1fr 150px 34px;gap:8px;margin-bottom:6px;align-items:center}
  .row .x{background:#fff;color:var(--danger);border:1px solid #e7c6ba;box-shadow:none;padding:0;height:34px;border-radius:7px}
  .row .x:hover{background:#fbeee9}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .spacer{flex:1}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
  .toast.show{opacity:.96}
  .hint{font-size:12px;color:var(--muted);margin:2px 0 14px}
  .err{color:var(--danger);font-size:13px;min-height:18px;margin-top:8px}
  .seg{display:inline-flex;gap:4px;background:#f1ece2;padding:4px;border-radius:9px}
  .seg button{background:transparent;color:var(--muted);box-shadow:none;font-size:13px;font-weight:600;padding:6px 14px;border-radius:7px}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="brandbar"></div>
  <h1>Owner Rates</h1>
  <p>Private area — sign in to manage rack &amp; STO rates.</p>
  <label for="pw">Owner password</label>
  <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
  <div class="err" id="loginErr"></div>
  <div style="margin-top:14px"><button id="loginBtn" style="width:100%">Sign in</button></div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <header class="top">
    <div class="lhs"><div class="dot"></div><h2 style="font-size:17px">Owner Rates</h2></div>
    <div><a class="ghost sm" href="/approvals/" style="text-decoration:none;margin-right:8px">Approvals</a><a class="ghost sm" href="/accounts/" style="text-decoration:none;margin-right:8px">Accounts</a><button class="ghost sm" id="logoutBtn">Sign out</button></div>
  </header>
  <div class="wrap">
    <div class="layout">
      <aside class="side">
        <div class="modeSwitch">
          <button class="ms active" data-mode="rack" id="msRack">Public · Rack</button>
          <button class="ms" data-mode="sto" id="msSto">Agent · STO</button>
        </div>
        <div class="navsel"><label>Category</label><select id="catSel"></select></div>
        <div class="navsel" id="regionWrap"><label>Region</label><select id="regionSel"></select></div>
        <div class="search"><input id="q" placeholder="Search…"></div>
        <button class="green sm" id="addBtn" style="width:100%;margin-bottom:6px">＋ Add lodge</button>
        <button class="sm" id="bulkBtn" style="width:100%;margin-bottom:8px;background:transparent;border:1px solid #a48256;color:#a48256">⇪ Bulk import (from PDF extract)</button>
        <div id="list"></div>
      </aside>
      <section class="main" id="editor">
        <div class="empty" id="emptyState">Pick an item on the left to load its rates.</div>
        <div id="edit" style="display:none">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
            <h2 id="edTitle" style="font-size:19px"></h2>
            <span class="spacer"></span>
            <button class="danger sm" id="delBtn">Delete this list</button>
          </div>
          <div class="hint" id="edSlug"></div>
          <div class="tabs">
            <button class="tab active" data-kind="rack" id="tabRack">Rack rates</button>
            <button class="tab" data-kind="sto" id="tabSto">STO (net) rates</button>
          </div>
          <div class="metagrid">
            <div><label>Name</label><input id="m_name"></div>
            <div><label>Region</label><input id="m_region"></div>
            <div><label>Currency</label><input id="m_currency"></div>
            <div><label>Validity</label><input id="m_validity"></div>
            <div id="commWrap"><label>Commission (STO)</label><input id="m_commission" placeholder="e.g. 20% STO"></div>
            <div><label>Note</label><input id="m_note"></div>
          </div>
          <div id="sections"></div>
          <div class="actions">
            <button class="ghost sm" id="addSection">＋ Add section</button>
            <span class="spacer"></span>
            <button id="saveBtn">Save <span id="saveKind"></span></button>
          </div>
          <div class="err" id="edErr"></div>
        </div>
      </section>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

  function currentItems(){

      suppliers.filter(function(s){return s.category==='accommodation'&&s.supplierSlug;}).forEach(function(s){ if(!items.some(function(i){return i.slug===s.supplierSlug;})) items.push({slug:s.supplierSlug,name:s.name||s.supplierSlug,region:'',supplier:true}); });

    } else if(category==='vehicle'){

    } else if(category==='activity'){

  // ── bulk import ───────────────────────────────────────
  $('bulkBtn').addEventListener('click',function(){ openBulkImport(); });
  function openBulkImport(){
    var biKind=mode; // default to the current mode
    var ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;z-index:500;background:rgba(30,28,26,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto';
    ov.innerHTML='<div style="background:#fff;border-radius:12px;max-width:640px;width:100%;padding:22px;box-shadow:0 25px 60px rgba(0,0,0,.3)">'
      +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><strong style="flex:1;font-size:1.05rem">Bulk import rates</strong><span class="biClose" style="cursor:pointer;font-size:1.5rem;color:#999">&times;</span></div>'
      +'<div style="margin-bottom:10px"><div class="seg"><button class="biR on" data-k="rack">Public · Rack</button><button class="biS" data-k="sto">Agent · STO</button></div></div>'
      +'<p style="font-size:.85rem;color:#7d756e;margin-bottom:10px">Paste the JSON extracted from a supplier PDF. Preview to check it, then Import — it saves to the database under the chosen rate type.</p>'
      +'<textarea class="biJson" placeholder="[ { &quot;slug&quot;: &quot;ongava-lodge&quot;, &quot;name&quot;: &quot;Ongava Lodge&quot;, &quot;region&quot;: &quot;South Etosha&quot;, &quot;sections&quot;: [ { &quot;title&quot;: &quot;Low Season&quot;, &quot;rows&quot;: [ [&quot;Full Board&quot;,&quot;12036&quot;] ] } ] } ]" style="width:100%;height:200px;font-family:monospace;font-size:12px;border:1px solid #ccc;border-radius:6px;padding:10px"></textarea>'
      +'<div class="biPreview" style="margin:10px 0;font-size:.85rem;max-height:180px;overflow:auto"></div>'
      +'<div style="display:flex;gap:10px;justify-content:flex-end"><button class="biPrev" style="padding:9px 16px;border:1px solid #a48256;border-radius:6px;background:#fff;color:#a48256;cursor:pointer;font-family:inherit">Preview / check</button><button class="biGo" style="padding:9px 16px;border:none;border-radius:6px;background:#87a996;color:#fff;cursor:pointer;font-family:inherit">Import</button></div></div>';
    document.body.appendChild(ov);
    var ta=ov.querySelector('.biJson'), prev=ov.querySelector('.biPreview'), goBtn=ov.querySelector('.biGo'), parsed=null;
    var biR=ov.querySelector('.biR'), biS=ov.querySelector('.biS');
    biR.onclick=function(){biKind='rack';biR.classList.add('on');biS.classList.remove('on');};
    biS.onclick=function(){biKind='sto';biS.classList.add('on');biR.classList.remove('on');};
    ov.onclick=function(e){if(e.target===ov)ov.remove();};
    ov.querySelector('.biClose').onclick=function(){ov.remove();};
    function num(v){ var n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?null:n; }
    function median(a){ a=a.slice().sort(function(x,y){return x-y;}); var m=Math.floor(a.length/2); return a.length?(a.length%2?a[m]:(a[m-1]+a[m])/2):0; }
    function mx(a){return Math.max.apply(null,a);} function mn(a){return Math.min.apply(null,a);}
    function checkLodge(l){
      var errs=[], warns=[], nrows=0, slug=l.slug||'';
      if(!slug) errs.push('missing slug');
      if(!l.sections||!l.sections.length) errs.push('no sections');
      (l.sections||[]).forEach(function(s){
        var prices=[];
        (s.rows||[]).forEach(function(r){
          if(!r[0] && !(r[1]||r[1]===0)) return;
          nrows++;
          var p=num(r[1]);
          if(p===null){ errs.push('non-numeric price for “'+(r[0]||'?')+'”'); return; }
          prices.push({label:String(r[0]||'').toLowerCase(),p:p});
        });
        if(prices.length){
          var med=median(prices.map(function(x){return x.p;}));
          prices.forEach(function(x){ if(med>0 && (x.p>med*10 || x.p<med/10)) warns.push('“'+x.label+'” ('+x.p+') looks off in '+(s.title||'section')); });
          var sng=prices.filter(function(x){return /single|sgl/.test(x.label);}).map(function(x){return x.p;});
          var shr=prices.filter(function(x){return /(sharing|double|dbl|twin|per person)/.test(x.label)&&!/single|sgl/.test(x.label);}).map(function(x){return x.p;});
          if(sng.length&&shr.length&&mx(sng)<mx(shr)) warns.push('single < sharing in '+(s.title||'section')+' (possible column swap)');
        }
      });
      if(!nrows) errs.push('no rate rows');
      return {slug:slug,name:l.name||slug,nrows:nrows,errs:errs,warns:warns};
    }
    function validate(){
      parsed=null;
      var arr; try{ arr=JSON.parse(ta.value); }catch(e){ prev.innerHTML='<span style="color:#c0392b">Invalid JSON: '+e.message+'</span>'; return null; }
      if(!Array.isArray(arr)) arr=[arr];
      var lines=[], anyErr=false;
      arr.forEach(function(l){
        var c=checkLodge(l);
        var icon=c.errs.length?'✗':(c.warns.length?'⚠️':'✓'), col=c.errs.length?'#c0392b':(c.warns.length?'#b9770e':'#2e7d46');
        if(c.errs.length) anyErr=true;
        var detail=(c.errs.length?'<div style="color:#c0392b;margin-left:20px">'+c.errs.join('; ')+'</div>':'')+(c.warns.length?'<div style="color:#b9770e;margin-left:20px">'+c.warns.join('; ')+'</div>':'');
        lines.push('<div style="padding:5px 0;border-bottom:1px solid #eee"><span style="color:'+col+'">'+icon+'</span> <strong>'+esc(c.name)+'</strong> <span style="color:#999">'+esc(c.slug)+'</span> — '+c.nrows+' rows'+detail+'</div>');
      });
      lines.push('<div style="padding:6px 0;font-size:.78rem;color:#7d756e">Importing as <strong>'+(biKind==='rack'?'PUBLIC RACK':'AGENT STO')+'</strong> · ✓ ok · ⚠️ check flagged rows (still importable) · ✗ fix before import</div>');
      prev.innerHTML=lines.join('');
      if(anyErr) return null;
      parsed=arr; return arr;
    }
    ov.querySelector('.biPrev').onclick=function(){ validate(); };
    goBtn.onclick=function(){
      var arr=parsed||validate();
      if(!arr){ return; }
      goBtn.disabled=true; goBtn.textContent='Importing…';
      var i=0, done=0, fail=0;
      function next(){
        if(i>=arr.length){ toast('Imported '+done+' '+(biKind==='rack'?'rack':'STO')+' list'+(done!==1?'s':'')+(fail?', '+fail+' failed':'')+'.'); ov.remove(); loadSummary(); return; }
        var l=arr[i++];
        var data={name:l.name||l.slug,region:l.region||'',currency:l.currency||'N$',validity:l.validity||'',note:l.note||'',commission:l.commission||'',sections:l.sections||[]};
        api({action:'save',slug:l.slug,kind:biKind,data:data}).then(function(r){ if(r.body&&r.body.ok)done++; else fail++; next(); }).catch(function(){ fail++; next(); });
      }
      next();
    };
    setTimeout(function(){ta.focus();},50);
  }

  // ── boot ──────────────────────────────────────────────
  if(token){ api({action:'list'}).then(function(r){ if(r.status===200&&r.body.ok){showApp()} else {showLogin()} }).catch(showLogin); }
  else showLogin();
})();
</script>
</body>
</html>
