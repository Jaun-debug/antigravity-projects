<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Owner Rates — Namibia Rates</title>
<style>
  :root{
    --gold:#B8956A; --gold-dk:#9c7b52; --green:#87a996; --green-dk:#6d8d7b;
    --blue:#2f6fd0; --bone:#F5F1E8; --card:#fffdf8; --ink:#2f2b25; --muted:#8a8175;
    --line:#e6ded0; --danger:#c0603f; --shadow:0 1px 3px rgba(60,50,35,.09);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bone);color:var(--ink);font-size:15px;line-height:1.4}
  a{color:var(--gold-dk)}
  h1,h2,h3{font-weight:600;margin:0}
  button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--gold);color:#fff;box-shadow:var(--shadow)}
  button:hover{background:var(--gold-dk)}
  button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
  button.ghost:hover{background:#faf6ee}
  button.green{background:var(--green)} button.green:hover{background:var(--green-dk)}
  button.danger{background:#fff;color:var(--danger);border:1px solid #e7c6ba;box-shadow:none}
  button.danger:hover{background:#fbeee9}
  button.sm{padding:5px 9px;font-size:13px;border-radius:6px}
  input,textarea,select{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#fff;width:100%}
  input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:-1px}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 3px 2px;letter-spacing:.02em;text-transform:uppercase}
  .wrap{max-width:1080px;margin:0 auto;padding:18px}
  #login{max-width:380px;margin:9vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;box-shadow:var(--shadow)}
  #login h1{font-size:20px;margin-bottom:4px}
  #login p{color:var(--muted);font-size:13px;margin:0 0 18px}
  .brandbar{height:5px;background:linear-gradient(90deg,var(--gold),var(--green));border-radius:14px 14px 0 0;margin:-26px -26px 20px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line)}
  header.top .lhs{display:flex;align-items:center;gap:10px}
  .dot{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--gold),var(--green))}
  .layout{display:grid;grid-template-columns:290px 1fr;gap:18px}
  @media(max-width:760px){.layout{grid-template-columns:1fr}}
  .side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow);align-self:start}
  .side .search{margin-bottom:10px}
  .modeSwitch{display:flex;gap:6px;margin-bottom:10px;background:#f1ece2;padding:4px;border-radius:9px}
  .ms{flex:1;background:transparent;color:var(--muted);box-shadow:none;border-radius:7px;padding:8px 6px;font-size:13px;font-weight:600}
  .ms:hover{background:#fff;color:var(--green-dk);box-shadow:var(--shadow)}
  .ms.active{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
  .ms[data-mode="sto"].active{color:var(--green-dk)}
  .ms.active:hover{color:var(--green-dk)}
  .navsel{margin-bottom:8px}
  .lodge{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 9px;border-radius:8px;cursor:pointer}
  .lodge:hover{background:#f6f1e7}
  .lodge:hover .nm{color:var(--green)}
  .lodge.active{background:#efe7d7}
  .lodge .nm{font-weight:500;font-size:14px;transition:color .12s}
  .lodge .rg{font-size:11px;color:var(--muted)}
  .grouphdr{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 6px 4px;font-weight:700;transition:color .12s}
  .grouphdr:hover{color:var(--green)}
  .mk{font-size:14px;color:#d7cfbf;width:20px;display:inline-block;text-align:center;flex:none}
  .mk.rk.on{color:var(--green)}
  .mk.st.on{color:var(--green-dk)}
  .mkyears{display:flex;gap:6px;flex:none;align-items:center}
  .yb{font-size:10px;font-weight:700;letter-spacing:.3px;color:#2f2b25;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid transparent;transition:.12s}
  .yb.on{color:var(--green-dk);border-color:var(--green-dk)}
  .main{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);min-height:60vh}
  .empty{color:var(--muted);text-align:center;padding:60px 20px}
  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}
  .tab{padding:9px 16px;border-radius:8px 8px 0 0;background:transparent;color:var(--muted);box-shadow:none}
  .tab:hover{background:#f6f1e7;color:var(--ink)}
  .tab.active{background:#efe7d7;color:var(--ink);font-weight:600}
  .metagrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
  @media(max-width:620px){.metagrid{grid-template-columns:1fr}}
  .section{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;background:#fffdf9}
  .section .shead{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .row{display:grid;grid-template-columns:1fr 150px 34px;gap:8px;margin-bottom:6px;align-items:center}
  .row .x{background:#fff;color:var(--danger);border:1px solid #e7c6ba;box-shadow:none;padding:0;height:34px;border-radius:7px}
  .row .x:hover{background:#fbeee9}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .spacer{flex:1}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
  .toast.show{opacity:.96}
  .hint{font-size:12px;color:var(--muted);margin:2px 0 14px}
  .err{color:var(--danger);font-size:13px;min-height:18px;margin-top:8px}
  .seg{display:inline-flex;gap:4px;background:#f1ece2;padding:4px;border-radius:9px}
  .seg button{background:transparent;color:var(--muted);box-shadow:none;font-size:13px;font-weight:600;padding:6px 14px;border-radius:7px}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="brandbar"></div>
  <h1>Owner Rates</h1>
  <p>Private area — sign in to manage rack &amp; STO rates.</p>
  <label for="pw">Owner password</label>
  <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
  <div class="err" id="loginErr"></div>
  <div style="margin-top:14px"><button id="loginBtn" style="width:100%">Sign in</button></div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <header class="top">
    <div class="lhs"><div class="dot"></div><h2 style="font-size:17px">Owner Rates</h2></div>
    <div><a class="ghost sm" href="/approvals/" style="text-decoration:none;margin-right:8px">Approvals</a><a class="ghost sm" href="/accounts/" style="text-decoration:none;margin-right:8px">Accounts</a><button class="ghost sm" id="logoutBtn">Sign out</button></div>
  </header>
  <div class="wrap">
    <div class="layout">
      <aside class="side">
        <div class="modeSwitch">
          <button class="ms active" data-mode="rack" id="msRack">Public · Rack</button>
          <button class="ms" data-mode="sto" id="msSto">Agent · STO</button>
        </div>
        <div class="navsel"><label>Category</label><select id="catSel"></select></div>
        <div class="navsel" id="regionWrap"><label>Region</label><select id="regionSel"></select></div>
        <div class="search"><input id="q" placeholder="Search…"></div>
        <button class="green sm" id="addBtn" style="width:100%;margin-bottom:6px">＋ Add lodge</button>
        <button class="sm" id="bulkBtn" style="width:100%;margin-bottom:8px;background:transparent;border:1px solid #a48256;color:#a48256">⇪ Bulk import (from PDF extract)</button>
        <div id="list"></div>
      </aside>
      <section class="main" id="editor">
        <div class="empty" id="emptyState">Pick an item on the left to load its rates.</div>
        <div id="edit" style="display:none">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
            <h2 id="edTitle" style="font-size:19px"></h2>
            <span class="spacer"></span>
            <button class="danger sm" id="delBtn">Delete this list</button>
          </div>
          <div class="hint" id="edSlug"></div>
          <div class="tabs">
            <button class="tab active" data-kind="rack" id="tabRack">Rack rates</button>
            <button class="tab" data-kind="sto" id="tabSto">STO (net) rates</button>
          </div>
          <div style="display:flex;align-items:center;gap:8px;margin:0 0 14px;flex-wrap:wrap">
            <label style="margin:0">Season year</label>
            <select id="edYear" style="width:auto;min-width:110px;padding:6px 10px"></select>
            <span class="hint" style="margin:0">Rack &amp; STO are stored separately per year.</span>
          </div>
          <div class="metagrid">
            <div><label>Name</label><input id="m_name"></div>
            <div><label>Region</label><input id="m_region"></div>
            <div><label>Currency</label><input id="m_currency"></div>
            <div><label>Validity</label><input id="m_validity"></div>
            <div id="commWrap"><label>Commission (STO)</label><input id="m_commission" placeholder="e.g. 20% STO"></div>
            <div><label>Note</label><input id="m_note"></div>
          </div>
          <div id="sections"></div>
          <div class="actions">
            <button class="ghost sm" id="addSection">＋ Add section</button>
            <span class="spacer"></span>
            <button id="saveBtn">Save <span id="saveKind"></span></button>
          </div>
          <div class="err" id="edErr"></div>
        </div>
      </section>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

  // ── data loading ──────────────────────────────────────
  function boot(){

    else fetch('/assets/lodge-pages.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){window._lodgeIndex=lodgeIndex=(j&&j.lodges)||[];buildRegionOptions();renderList();}).catch(function(){lodgeIndex=[];});
    // supplier accounts (so new signups appear). Needs the portal owner cookie; if unavailable, skip gracefully.
    fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'listUsers'})})
      .then(function(r){return r.json();}).then(function(j){ if(j&&j.ok&&j.users){ suppliers=j.users.filter(function(u){return u.role==='supplier';}); renderList(); } }).catch(function(){});
    buildCatOptions();
  }
  function loadSummary(){
    api({action:'list'}).then(function(r){
      if(r.status===401){showLogin();return}

    $('regionWrap').style.display=(category==='accommodation')?'block':'none';
  }

    regs.sort();
    $('regionSel').innerHTML='<option value="">All regions</option>'+regs.map(function(r){return '<option value="'+esc(r)+'">'+esc(r)+'</option>';}).join('');

  // ── build item set for the current mode/category ──────
  function currentItems(){
    var items=[];
    if(category==='accommodation'){
      items=lodgeIndex.map(function(l){return {slug:l.slug,name:l.name,region:l.region};});
      suppliers.filter(function(s){return s.category==='accommodation'&&s.supplierSlug;}).forEach(function(s){ if(!items.some(function(i){return i.slug===s.supplierSlug;})) items.push({slug:s.supplierSlug,name:s.name||s.supplierSlug,region:'',supplier:true}); });
    } else if(category==='group'){
      items=GROUPS.slice();
      suppliers.filter(function(s){return s.category==='group';}).forEach(function(s){var sl=s.supplierSlug||slugify(s.name||s.email);if(!items.some(function(i){return i.slug===sl;}))items.push({slug:sl,name:s.name||s.email,supplier:true});});
    } else if(category==='vehicle'){
      items=VEHICLES.slice();
      suppliers.filter(function(s){return s.category==='vehicle';}).forEach(function(s){var sl=s.supplierSlug||slugify(s.name||s.email);if(!items.some(function(i){return i.slug===sl;}))items.push({slug:sl,name:s.name||s.email,supplier:true});});
    } else if(category==='activity'){
      items=ACTIVITIES.slice();
      suppliers.filter(function(s){return s.category==='activity';}).forEach(function(s){var sl=s.supplierSlug||slugify(s.name||s.email);if(!items.some(function(i){return i.slug===sl;}))items.push({slug:sl,name:s.name||s.email,supplier:true});});
    }
    var q=($('q').value||'').trim().toLowerCase();
    if(q) items=items.filter(function(i){return ((i.name||'')+' '+(i.region||'')+' '+i.slug).toLowerCase().indexOf(q)>-1;});
    return items;
  }
  function markerHtml(slug){
    var s=summary[slug]||{};
    var years = mode==='rack' ? (s.rackYears||[]) : (s.stoYears||[]);
    var legacy = mode==='rack' ? s.rackLegacy : s.stoLegacy;
    function badge(y,short){
      var on = years.indexOf(String(y))>-1 || (String(y)==='2026' && legacy);
      return '<span class="yb '+(on?'on':'')+'" title="'+y+' '+(mode==='rack'?'rack':'STO')+' '+(on?'loaded':'not loaded')+'">'+short+'</span>';
    }
    return '<span class="mkyears">'+badge('2026','26')+badge('2027','27')+'</span>';
  }
  function itemRow(i){
    var d=document.createElement('div');d.className='lodge'+(current&&current.slug===i.slug?' active':'');
    d.innerHTML='<div><div class="nm">'+esc(i.name||i.slug)+'</div>'+(i.region?'<div class="rg">'+esc(i.region)+'</div>':'')+'</div>'+markerHtml(i.slug);
    d.addEventListener('click',function(){openItem(i)});
    return d;
  }
  function renderList(){
    var box=$('list');box.innerHTML='';
    var items=currentItems();
    if(!items.length){box.innerHTML='<div class="hint" style="padding:6px">Nothing here yet.</div>';return}
    var q=($('q').value||'').trim().toLowerCase();
    if(category==='accommodation'){
      // collapsible region groups — folded by default, the region picked at the top opens.
      var byReg={},order=[];
      items.forEach(function(i){var r=i.region||'Other';if(!byReg[r]){byReg[r]=[];order.push(r);}byReg[r].push(i);});
      order.sort();
      var openTarget=null;
      order.forEach(function(r){
        var open = q ? true : !!openRegions[r];
        var h=document.createElement('div');h.className='grouphdr';h.style.cursor='pointer';
        h.innerHTML='<span style="display:inline-block;width:14px;color:#b8a988">'+(open?'▾':'▸')+'</span>'+esc(r)+' <span style="color:#cfc7b8;font-weight:400">('+byReg[r].length+')</span>';
        h.addEventListener('click',function(){ openRegions[r]=!open; renderList(); });
        box.appendChild(h);
        if(open){ byReg[r].forEach(function(i){box.appendChild(itemRow(i));}); if(r===region) openTarget=h; }
      });
      if(openTarget) setTimeout(function(){ openTarget.scrollIntoView({block:'nearest'}); },0);
    } else if(category==='group'){
      // each group folds open to reveal its member lodges
      items.forEach(function(g){
        var members=groupMembers(g.slug);
        if(!members.length){ box.appendChild(itemRow(g)); return; }  // single-property group: direct leaf
        var open=!!openGroups[g.slug]||!!q;
        var h=document.createElement('div');h.className='grouphdr';h.style.cursor='pointer';
        h.innerHTML='<span style="display:inline-block;width:14px;color:#b8a988">'+(open?'▾':'▸')+'</span>'+esc(g.name)+' <span style="color:#cfc7b8;font-weight:400">('+members.length+')</span>';
        h.addEventListener('click',function(){openGroups[g.slug]=!open;renderList();});
        box.appendChild(h);
        if(open){
          box.appendChild(itemRow({slug:g.slug,name:g.name+' — group rate sheet'}));
          members.forEach(function(m){box.appendChild(itemRow(m));});
        }
      });
    } else {
      items.forEach(function(i){box.appendChild(itemRow(i));});
    }
  }
  function lodgeBySlug(sl){return (lodgeIndex||[]).filter(function(x){return x.slug===sl;})[0]||{slug:sl,name:sl,region:''};}
  function groupMembers(slug){
    return (GROUP_MEMBERS[slug]||[]).map(function(m){ var l=lodgeBySlug(m.slug); return {slug:m.slug, name:m.name||l.name, region:l.region||''}; });
  }

  // ── open / edit ───────────────────────────────────────
  function openItem(i,yr){
    api({action:'get',slug:i.slug,year:yr}).then(function(r){
      var b=r.body||{};
      if(b.ok&&(b.rack||b.sto)){ current={slug:i.slug,rack:b.rack,sto:b.sto}; }
      else { current=freshItem(i); }
      editYear=String(yr||b.year||new Date().getFullYear());
      yearsAvail=[].concat(b.rackYears||[],b.stoYears||[]);
      kind=mode;renderEditor();renderList();
      if(!yr) toast('Editing '+(i.name||i.slug)+' — '+(mode==='rack'?'rack':'STO')+' rates.');
    }).catch(function(){ current=freshItem(i);editYear=String(new Date().getFullYear());yearsAvail=[];kind=mode;renderEditor(); });
  }
  function edYearOptions(){
    var now=new Date().getFullYear();var set=[now,now+1];
    (yearsAvail||[]).forEach(function(y){var n=parseInt(y,10);if(!isNaN(n)&&set.indexOf(n)<0)set.push(n);});
    var e=parseInt(editYear,10);if(!isNaN(e)&&set.indexOf(e)<0)set.push(e);
    set.sort(function(a,b){return a-b;});
    var el=$('edYear');if(el)el.innerHTML=set.map(function(y){return '<option value="'+y+'"'+(String(y)===String(editYear)?' selected':'')+'>'+y+'</option>';}).join('');
  }
  function freshItem(i){
    var base={name:i.name||i.slug,region:i.region||'',currency:'N$',validity:'',note:'',commission:'',sections:[{title:'Rates',rows:[['','']]}]};
    return mode==='rack' ? {slug:i.slug,rack:base,sto:null} : {slug:i.slug,rack:null,sto:base};
  }
  function blankDoc(){return{name:'',region:'',currency:'N$',validity:'',note:'',commission:'',sections:[]}}
  function activeDoc(){

  function renderEditor(){
    if(!current){$('edit').style.display='none';$('emptyState').style.display='block';return}

  function renderSections(){
    var d=activeDoc();var box=$('sections');box.innerHTML='';

  function openLodgePicker(){
    var ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;z-index:500;background:rgba(30,28,26,.5);display:flex;align-items:flex-start;justify-content:center;padding:56px 16px;';
    ov.innerHTML='<div style="background:#fff;border-radius:12px;max-width:520px;width:100%;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,.3)">'
      +'<div style="padding:16px 20px;border-bottom:1px solid #eee;display:flex;gap:10px;align-items:center"><strong style="flex:1">Pick a lodge</strong><span class="lpClose" style="cursor:pointer;font-size:1.5rem;line-height:1;color:#999">&times;</span></div>'
      +'<input class="lpSearch" placeholder="Search lodges…" style="margin:14px 20px;padding:10px 12px;border:1px solid #ccc;border-radius:6px;font-size:1rem;font-family:inherit">'
      +'<div class="lpList" style="overflow-y:auto;padding:0 12px 14px"></div></div>';
    document.body.appendChild(ov);
    var list=ov.querySelector('.lpList'), search=ov.querySelector('.lpSearch');
    function draw(q){ q=(q||'').toLowerCase();
      var items=(lodgeIndex||[]).filter(function(l){return !q||(l.name+' '+l.region+' '+l.slug).toLowerCase().indexOf(q)>=0;}).slice(0,150);
      list.innerHTML=items.map(function(l){return '<div class="lp-item" data-slug="'+l.slug+'" style="padding:10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:10px"><span>'+esc(l.name)+'</span><span style="color:#999;font-size:.85rem">'+esc(l.region)+'</span></div>';}).join('')||'<div style="padding:14px;color:#999">No match.</div>';
      Array.prototype.forEach.call(list.querySelectorAll('.lp-item'),function(el){
        el.onmouseenter=function(){el.style.background='#f2efe9';}; el.onmouseleave=function(){el.style.background='';};
        el.onclick=function(){ ov.remove(); var slug=el.getAttribute('data-slug'); var l=(lodgeIndex||[]).filter(function(x){return x.slug===slug;})[0]||{slug:slug,name:slug,region:''}; openItem(l); };
      });
    }
    ov.onclick=function(e){ if(e.target===ov) ov.remove(); };
    ov.querySelector('.lpClose').onclick=function(){ ov.remove(); };
    search.oninput=function(){ draw(search.value); };
    draw('');
    setTimeout(function(){search.focus();},50);
  }

  // ── bulk import ───────────────────────────────────────
  $('bulkBtn').addEventListener('click',function(){ openBulkImport(); });
  function openBulkImport(){
    var biKind=mode; // default to the current mode
    var biYear=String(new Date().getFullYear());
    var extracted=null;
    var now=new Date().getFullYear();
    var ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;z-index:500;background:rgba(30,28,26,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto';
    ov.innerHTML='<div style="background:#fff;border-radius:12px;max-width:640px;width:100%;padding:22px;box-shadow:0 25px 60px rgba(0,0,0,.3)">'
      +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><strong style="flex:1;font-size:1.05rem">Import a rate sheet (PDF)</strong><span class="biClose" style="cursor:pointer;font-size:1.5rem;color:#999">&times;</span></div>'
      +'<div style="display:flex;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap"><div class="seg"><button class="biR on" data-k="rack">Public · Rack</button><button class="biS" data-k="sto">Agent · STO</button></div><label style="margin:0">Year</label><select class="biYear" style="width:auto;padding:7px 10px">'+[now,now+1].map(function(y){return '<option value="'+y+'">'+y+'</option>';}).join('')+'</select></div>'
      +'<p style="font-size:.85rem;color:#7d756e;margin-bottom:12px">Upload a PDF of the rate sheet — our AI reads it, then you review and import. It saves directly under the chosen rate type and year.</p>'
      +'<div class="biDrop" style="border:2px dashed #cdb68f;border-radius:10px;padding:36px 20px;text-align:center;color:#7d756e;cursor:pointer;background:#fbf7ef"><strong style="color:#a48256">Choose a PDF</strong> or drag it here<div style="font-size:.8rem;margin-top:6px">Up to ~4 MB</div></div>'
      +'<input class="biFile" type="file" accept="application/pdf,.pdf" style="display:none">'
      +'<div class="biStatus" style="margin-top:10px;font-size:.9rem;min-height:1em"></div>'
      +'<div class="biPrev2" style="margin-top:8px"></div>'
      +'</div>';
    document.body.appendChild(ov);
    var biR=ov.querySelector('.biR'), biS=ov.querySelector('.biS'), yearSel=ov.querySelector('.biYear');
    var drop=ov.querySelector('.biDrop'), file=ov.querySelector('.biFile'), status=ov.querySelector('.biStatus'), prev=ov.querySelector('.biPrev2');
    biR.onclick=function(){biKind='rack';biR.classList.add('on');biS.classList.remove('on');};
    biS.onclick=function(){biKind='sto';biS.classList.add('on');biR.classList.remove('on');};
    if(mode==='sto') biS.click();
    yearSel.value=biYear; yearSel.onchange=function(){biYear=yearSel.value;};
    ov.onclick=function(e){if(e.target===ov)ov.remove();};
    ov.querySelector('.biClose').onclick=function(){ov.remove();};
    drop.onclick=function(){file.click();};
    ['dragenter','dragover'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.style.background='#f6efdf';});});
    ['dragleave','drop'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.style.background='#fbf7ef';});});
    drop.addEventListener('drop',function(e){if(e.dataTransfer.files&&e.dataTransfer.files[0])handle(e.dataTransfer.files[0]);});
    file.onchange=function(){if(file.files&&file.files[0])handle(file.files[0]);};
    function slugify(s){return String(s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}
    function handle(f){
      if(!/pdf/i.test(f.type)&&!/\.pdf$/i.test(f.name)){status.style.color='#c0392b';status.textContent='Please choose a PDF.';return;}
      if(f.size>4*1024*1024){status.style.color='#c0392b';status.textContent='That PDF is a bit large (max ~4 MB).';return;}
      status.style.color='#7d756e';status.textContent='Reading “'+f.name+'” with AI… this can take a moment.';prev.innerHTML='';extracted=null;
      var reader=new FileReader();
      reader.onload=function(){
        var b64=String(reader.result).split(',')[1]||'';
        fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:f.name,contentType:f.type||'application/pdf',dataBase64:b64,kind:biKind,token:token})})
          .then(function(r){ if(!r.ok) throw new Error(r.status===504||r.status===502?'timeout':'HTTP '+r.status); return r.json(); })
          .then(function(r){
            if(r&&r.ok&&r.extracted){ extracted=r.extracted; renderPreview(r); }
            else { status.style.color='#c0392b';status.textContent=(r&&r.error)||'Could not read that PDF.'; }
          }).catch(function(e){
            var m=(e&&e.message)||'';
            status.style.color='#c0392b';
            status.textContent = m==='timeout'
              ? 'That sheet took too long to read. Try a smaller PDF, or split it into fewer properties per file.'
              : 'Could not read that PDF ('+(m||'network error')+'). Please try again.';
          });
      };
      reader.readAsDataURL(f);
    }
    // Match an extracted property name to an existing lodge slug.
    function matchSlug(name){
      var k=String(name||'').toLowerCase().replace(/[^a-z0-9]/g,'');
      if(!k) return {slug:'',matched:false};
      var idx=lodgeIndex||[], i;
      for(i=0;i<idx.length;i++){ var lk=String(idx[i].name||'').toLowerCase().replace(/[^a-z0-9]/g,''); if(lk&&lk===k) return {slug:idx[i].slug,matched:true}; }
      for(i=0;i<idx.length;i++){ var l2=String(idx[i].name||'').toLowerCase().replace(/[^a-z0-9]/g,''); if(l2&&(l2.indexOf(k)>-1||k.indexOf(l2)>-1)&&Math.abs(l2.length-k.length)<6) return {slug:idx[i].slug,matched:true}; }
      return {slug:slugify(name),matched:false};
    }
    function renderPreview(r){
      var props=(r.properties&&r.properties.length)?r.properties:[extracted];
      if(r.year){ biYear=String(r.year).replace(/[^0-9]/g,'')||biYear; yearSel.value=biYear; }
      status.style.color='#2e7d46';
      status.textContent='Read successfully — '+props.length+' propert'+(props.length===1?'y':'ies')+' found. Check the slugs, then import.';
      var rowsHtml=props.map(function(p,i){
        var rows=0;(p.sections||[]).forEach(function(s){rows+=(s.rows||[]).length;});
        var m=matchSlug(p.name);
        return '<div class="biRow" data-i="'+i+'" style="display:grid;grid-template-columns:22px 1fr 210px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #f2eee6">'
          +'<input type="checkbox" class="biOn" checked style="width:auto">'
          +'<div><div style="font-weight:600;font-size:.92rem">'+esc(p.name||'(unnamed)')+'</div>'
          +'<div style="font-size:.76rem;color:#8a8175">'+(p.region?esc(p.region)+' · ':'')+rows+' rows'+(m.matched?'':' · <span style="color:#b9770e">new entry</span>')+'</div></div>'
          +'<input class="biSlug" value="'+esc(m.slug)+'" title="Must match the lodge page URL" style="padding:7px 9px;border:1px solid '+(m.matched?'#a9c6b5':'#e0d6c4')+';border-radius:6px;font-size:.84rem">'
          +'</div>';
      }).join('');
      prev.innerHTML='<div style="border:1px solid #eee;border-radius:8px;padding:14px">'
        +'<div style="font-size:.8rem;color:#8a8175;margin-bottom:8px">Confidence '+(r.confidence==null?'n/a':r.confidence+'%')+' · untick anything you don\'t want, and fix any slug that didn\'t match</div>'
        +rowsHtml
        +((r.anomalies&&r.anomalies.length)?'<div style="font-size:.8rem;color:#b9770e;margin-top:10px">Worth a look: '+r.anomalies.map(esc).join('; ')+'</div>':'')
        +'<div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="biImport" style="padding:9px 16px;border:none;border-radius:6px;background:#87a996;color:#fff;cursor:pointer;font-family:inherit">Import to '+(biKind==='rack'?'Rack':'STO')+' '+biYear+'</button></div>'
        +'</div>';
      prev.querySelector('.biImport').onclick=function(){ doImport(props); };
    }
    function doImport(props){
      var jobs=[];
      [].forEach.call(prev.querySelectorAll('.biRow'),function(el){
        if(!el.querySelector('.biOn').checked) return;
        var i=parseInt(el.getAttribute('data-i'),10);
        var slug=slugify(el.querySelector('.biSlug').value);
        if(slug&&props[i]) jobs.push({slug:slug,data:props[i]});
      });
      if(!jobs.length){status.style.color='#c0392b';status.textContent='Nothing selected to import.';return;}
      var btn=prev.querySelector('.biImport'); btn.disabled=true;
      var i=0,done=0,fail=0;
      function next(){
        if(i>=jobs.length){
          toast('Imported '+done+' propert'+(done===1?'y':'ies')+(fail?', '+fail+' failed':'')+' — '+(biKind==='rack'?'rack':'STO')+' '+biYear);
          ov.remove(); loadSummary(); return;
        }
        var j=jobs[i++]; btn.textContent='Importing '+i+' of '+jobs.length+'…';
        api({action:'save',slug:j.slug,kind:biKind,data:j.data,year:biYear})
          .then(function(rr){ if(rr.body&&rr.body.ok)done++; else fail++; next(); })
          .catch(function(){ fail++; next(); });
      }
      next();
    }
  }

  // ── boot ──────────────────────────────────────────────
  if(token){ api({action:'list'}).then(function(r){ if(r.status===200&&r.body.ok){showApp()} else {showLogin()} }).catch(showLogin); }
  else showLogin();
})();
</script>
</body>
