<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Itinerary Builder — Namibia Rates</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEEAE3;--card:#fff;--ink:#2C2824;--muted:#7A7269;--gold:#B8956A;--green:#87a996;
--border:rgba(184,149,106,.22);--head:'Cormorant Garamond',serif;--body:'Inter',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
.banner{background:#2C2824;color:#E9E2D6;font-size:.7rem;letter-spacing:.4px;text-align:center;padding:8px 16px}
.banner strong{color:#B8956A}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 26px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:12px}
.brand{font-family:var(--head);font-size:1.4rem;font-weight:500;letter-spacing:1px;text-decoration:none}
.brand span{color:var(--gold)}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--body);font-size:.66rem;letter-spacing:1.5px;text-transform:uppercase;
padding:10px 18px;border-radius:30px;cursor:pointer;border:1px solid var(--gold);background:var(--gold);color:#fff;text-decoration:none;transition:.2s}
.btn:hover{filter:brightness(.95)}
.btn.ghost{background:transparent;color:var(--gold)}
.btn.ghost:hover{background:rgba(184,149,106,.08)}
.btn.dark{background:#2C2824;border-color:#2C2824}
.layout{display:flex;gap:24px;max-width:1240px;margin:0 auto;padding:24px 22px 140px;align-items:flex-start}
/* sidebar */
.side{flex:0 0 250px;position:sticky;top:18px}
.side h4{font-size:.62rem;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin:0 6px 12px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:9px;text-decoration:none;color:var(--ink);font-size:.85rem;font-weight:500;cursor:pointer;transition:.15s;margin-bottom:3px}
.nav a:hover{background:rgba(184,149,106,.08)}
.nav a.active{background:#2C2824;color:#fff;box-shadow:0 6px 18px rgba(44,40,36,.16)}
.nav .num{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--muted);background:#fff}
.nav a.active .num{border-color:rgba(255,255,255,.35);color:#fff;background:transparent}
.nav a.done .num{background:var(--green);border-color:var(--green);color:#fff}
/* main */
.main{flex:1 1 auto;min-width:0}
.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:26px;box-shadow:0 8px 30px rgba(44,40,36,.05)}
.panel h2{font-family:var(--head);font-weight:400;font-size:1.7rem;margin-bottom:4px}
.panel .lead{color:var(--muted);font-size:.9rem;margin-bottom:20px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fld label{font-size:.63rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-family:var(--body);font-size:.92rem;background:#fbfaf8;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
/* tables */
table.bd{width:100%;border-collapse:collapse}
table.bd th{font-size:.6rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 7px;border-bottom:1px solid var(--border);font-weight:500}
table.bd th.r,table.bd td.r{text-align:right}
table.bd td{padding:9px 7px;border-bottom:1px solid var(--border);vertical-align:top}
.rownum{color:var(--gold);font-family:var(--head);font-size:1.05rem}
.bd select,.bd input{border:1px solid var(--border);border-radius:8px;padding:7px 8px;font-family:var(--body);font-size:.84rem;background:#fbfaf8;color:var(--ink);width:100%}
.bd .nights,.bd .pax{width:60px;text-align:center}
.cellsel{display:flex;flex-direction:column;gap:5px;min-width:190px}
.amtcell{font-family:var(--head);font-size:1.02rem;white-space:nowrap}
.amtcell.g{color:var(--gold)}
.rm{border:none;background:none;color:#c08a8a;cursor:pointer;font-size:1.05rem;padding:0 3px}
.rm:hover{color:#a85a5a}
.viewlink{font-size:.62rem;letter-spacing:1px;text-transform:uppercase;color:var(--gold);text-decoration:none}
.li{display:flex;gap:10px;align-items:center;margin-bottom:9px}
.li input.nm{flex:1 1 auto}
.li input.am{width:140px;text-align:right}
.addbtn{margin-top:6px}
.muted{color:var(--muted);font-size:.85rem;font-style:italic;padding:8px 2px}
.sec-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.sec-total .lbl{font-size:.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.sec-total .amt{font-family:var(--head);font-size:1.5rem;color:var(--gold)}
/* summary */
.sumrow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:.92rem}
.sumrow .v{font-weight:500}
.sumrow.big{font-family:var(--head);font-size:1.3rem;border-bottom:none;padding-top:16px}
.ppgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.ppcard{background:#fbfaf8;border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.ppcard .l{font-size:.62rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.ppcard .n{font-family:var(--head);font-size:1.6rem;margin-top:4px}
/* sticky total bar */
.totalbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(44,40,36,.97);backdrop-filter:blur(8px);color:#fff;
display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 26px;flex-wrap:wrap}
.totalbar .grp{display:flex;gap:26px;flex-wrap:wrap}
.totalbar .lbl{font-size:.6rem;letter-spacing:2px;text-transform:uppercase;color:#B8956A}
.totalbar .amt{font-family:var(--head);font-size:1.5rem}
.mk-inp{width:70px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:8px;padding:6px 8px;font-family:var(--body);font-size:.9rem;text-align:center}
@media(max-width:880px){.layout{flex-direction:column}.side{position:static;flex-basis:auto;width:100%}.nav{display:flex;flex-wrap:wrap;gap:6px}.nav a{margin:0}.grid2,.grid3,.ppgrid{grid-template-columns:1fr}}
@media print{.banner,.topbar,.side,.totalbar,.addbtn,.rm,.viewlink{display:none!important}.layout{display:block}body{background:#fff}}
</style>
</head>
<body>
<div class="banner">&#9888; <strong>Development Version.</strong> Rates are illustrative examples only — confirm live rates &amp; availability with each property.</div>
<div class="topbar">
  <a class="brand" href="/">Namibia<span>Rates</span> &middot; Itinerary Builder</a>
  <div class="top-actions">
    <button class="btn ghost" id="btn-save" type="button">Save quote</button>
    <button class="btn ghost" id="btn-saved" type="button">Saved quotes</button>
    <button class="btn ghost" onclick="window.print()" type="button">Print / PDF</button>
    <a class="btn dark" href="/itinerary/">&larr; Itinerary</a>
  </div>
</div>

<div class="layout">
  <aside class="side">
    <h4>Quote flow</h4>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main"><div class="panel" id="panel"></div></main>
</div>

<div class="totalbar">
  <div class="grp">
    <div><div class="lbl">Net</div><div class="amt" id="t-net">N$ 0.00</div></div>
    <div><div class="lbl">Markup</div><input class="mk-inp" id="t-markup" type="number" min="0" step="0.5" value="25"></div>
    <div><div class="lbl">Sell</div><div class="amt" id="t-sell" style="color:#cdb089">N$ 0.00</div></div>
  </div>
  <div><div class="lbl">Per adult (sell)</div><div class="amt" id="t-pp">N$ 0.00</div></div>
</div>

<script>
var RATES={lodges:[]};
var SECTIONS=[
  {id:'trip',n:1,label:'Trip & Client'},
  {id:'lodges',n:2,label:'Lodges & Accommodation'},
  {id:'vehicle',n:3,label:'Vehicle & Fuel'},
  {id:'guide',n:4,label:'Guide Costs'},
  {id:'flights',n:5,label:'Flights'},
  {id:'activities',n:6,label:'Activities'},
  {id:'extras',n:7,label:'Extras'},
  {id:'botswana',n:8,label:'Botswana / Add-ons'},
  {id:'final',n:9,label:'Final Pricing'}
];
var S={
  name:'',adults:2,children:0,markup:25,
  lodges:[],
  vehicleTotal:0, fuelKm:0, fuelType:'2wd',
  guide:[],flights:[],activities:[],extras:[],botswana:[]
};
var active='trip';
function money(n){return 'N$ '+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2})}
function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function num(v){return Math.max(0,parseFloat(v)||0)}
function regions(){var o={};RATES.lodges.forEach(function(l){o[l.region]=1});return Object.keys(o).sort()}
function lodgesIn(r){var a=[];RATES.lodges.forEach(function(l,i){if(l.region===r)a.push(i)});return a}

/* ---- totals ---- */
function accomTotal(){var t=0;S.lodges.forEach(function(d){var p=lodgePrice(d);t+=p*(d.pax||0)*(d.nights||0)});return t}
function lodgePrice(d){if(d.lodgeIdx>-1&&d.roomIdx>-1){var L=RATES.lodges[d.lodgeIdx];if(L&&L.rates[d.roomIdx])return L.rates[d.roomIdx].p}return 0}
function fuelCost(){return num(S.fuelKm)*(S.fuelType==='4wd'?4.0:3.125)}
function sumLI(arr){var t=0;(arr||[]).forEach(function(x){t+=num(x.amount)});return t}
function netTotal(){return accomTotal()+num(S.vehicleTotal)+fuelCost()+sumLI(S.guide)+sumLI(S.flights)+sumLI(S.activities)+sumLI(S.extras)+sumLI(S.botswana)}
function updateTotals(){
  S.markup=num(document.getElementById('t-markup').value);
  var net=netTotal(), sell=net*(1+S.markup/100), pax=Math.max(1,parseInt(S.adults)||1);
  document.getElementById('t-net').textContent=money(net);
  document.getElementById('t-sell').textContent=money(sell);
  document.getElementById('t-pp').textContent=money(sell/pax);
  renderNav();
  if(active==='final') renderPanel();
}

/* ---- nav ---- */
function hasData(id){
  switch(id){
    case 'trip':return !!S.name;
    case 'lodges':return S.lodges.length>0;
    case 'vehicle':return num(S.vehicleTotal)>0||num(S.fuelKm)>0;
    case 'guide':return sumLI(S.guide)>0;
    case 'flights':return sumLI(S.flights)>0;
    case 'activities':return sumLI(S.activities)>0;
    case 'extras':return sumLI(S.extras)>0;
    case 'botswana':return sumLI(S.botswana)>0;
    default:return false;
  }
}
function renderNav(){
  document.getElementById('nav').innerHTML=SECTIONS.map(function(s){
    return '<a data-id="'+s.id+'" class="'+(active===s.id?'active':'')+(hasData(s.id)?' done':'')+'">'
      +'<span class="num">'+(hasData(s.id)&&active!==s.id?'✓':s.n)+'</span>'+esc(s.label)+'</a>';
  }).join('');
  document.querySelectorAll('#nav a').forEach(function(a){a.onclick=function(){active=a.dataset.id;renderNav();renderPanel();}});
}

/* ---- generic line-item section ---- */
function liSection(key,label,ph){
  var rows=(S[key].length?S[key]:[]).map(function(x,i){
    return '<div class="li"><input class="nm" data-k="'+key+'" data-i="'+i+'" data-f="name" value="'+esc(x.name)+'" placeholder="'+esc(ph)+'">'
      +'<input class="am" type="number" min="0" data-k="'+key+'" data-i="'+i+'" data-f="amount" value="'+(x.amount||'')+'" placeholder="0.00">'
      +'<button class="rm" data-k="'+key+'" data-i="'+i+'">&times;</button></div>';
  }).join('');
  if(!S[key].length) rows='<div class="muted">None added yet.</div>';
  return '<div id="li-'+key+'">'+rows+'</div><button class="btn ghost addbtn" data-add="'+key+'" type="button">+ Add line</button>'
    +'<div class="sec-total"><span class="lbl">'+esc(label)+' total</span><span class="amt">'+money(sumLI(S[key]))+'</span></div>';
}

/* ---- panels ---- */
function renderPanel(){
  var p=document.getElementById('panel'),h='';
  if(active==='trip'){
    h='<h2>Trip &amp; Client</h2><p class="lead">Who the quote is for and your markup.</p>'
      +'<div class="fld"><label>Quote / client name</label><input id="f-name" value="'+esc(S.name)+'" placeholder="e.g. Smith — Namibia 2026"></div>'
      +'<div class="grid3"><div class="fld"><label>Adults</label><input id="f-adults" type="number" min="1" value="'+S.adults+'"></div>'
      +'<div class="fld"><label>Children</label><input id="f-children" type="number" min="0" value="'+S.children+'"></div>'
      +'<div class="fld"><label>Markup %</label><input id="f-markup" type="number" min="0" step="0.5" value="'+S.markup+'"></div></div>';
  } else if(active==='lodges'){
    var regs=regions();
    var body=S.lodges.map(function(d,i){
      var regOpts='<option value="">Region…</option>'+regs.map(function(r){return '<option '+(d.region===r?'selected':'')+'>'+esc(r)+'</option>'}).join('');
      var lodgeOpts='<option value="-1">Lodge…</option>';
      if(d.region) lodgesIn(d.region).forEach(function(li){lodgeOpts+='<option value="'+li+'" '+(d.lodgeIdx===li?'selected':'')+'>'+esc(RATES.lodges[li].name)+'</option>'});
      var roomOpts='<option value="-1">Room / rate…</option>',view='';
      if(d.lodgeIdx>-1){var L=RATES.lodges[d.lodgeIdx];L.rates.forEach(function(rt,ri){roomOpts+='<option value="'+ri+'" '+(d.roomIdx===ri?'selected':'')+'>'+esc(rt.n)+' — '+money(rt.p)+'</option>'});view='<a class="viewlink" href="'+esc(L.file)+'" target="_blank">View sheet ↗</a>'}
      var pn=lodgePrice(d), sub=pn*(d.pax||0)*(d.nights||0);
      return '<tr><td class="rownum">'+(i+1)+'</td>'
        +'<td><input class="nights" type="number" min="1" value="'+(d.nights||1)+'" data-i="'+i+'" data-f="nights"></td>'
        +'<td><div class="cellsel"><select data-i="'+i+'" data-f="region">'+regOpts+'</select><select data-i="'+i+'" data-f="lodgeIdx">'+lodgeOpts+'</select>'+view+'</div></td>'
        +'<td><select data-i="'+i+'" data-f="roomIdx">'+roomOpts+'</select></td>'
        +'<td><input class="pax" type="number" min="1" value="'+(d.pax||1)+'" data-i="'+i+'" data-f="pax"></td>'
        +'<td class="r amtcell">'+(pn?money(pn):'—')+'</td>'
        +'<td class="r amtcell g">'+money(sub)+'</td>'
        +'<td><button class="rm" data-lodge-rm="'+i+'">&times;</button></td></tr>';
    }).join('');
    if(!S.lodges.length) body='<tr><td colspan="8" class="muted">No lodges yet — add days, or build in the card itinerary and use “Cost this itinerary”.</td></tr>';
    h='<h2>Lodges &amp; Accommodation</h2><p class="lead">Per-night rates are per person, pulled from the live rate sheets.</p>'
      +'<div style="overflow-x:auto"><table class="bd"><thead><tr><th style="width:34px">#</th><th style="width:64px">Nights</th><th>Region &amp; Lodge</th><th>Room / rate</th><th style="width:60px">Pax</th><th class="r">Per night</th><th class="r">Subtotal</th><th></th></tr></thead><tbody>'+body+'</tbody></table></div>'
      +'<button class="btn ghost addbtn" id="add-lodge" type="button">+ Add day / lodge</button>'
      +'<div class="sec-total"><span class="lbl">Accommodation total</span><span class="amt">'+money(accomTotal())+'</span></div>';
  } else if(active==='vehicle'){
    h='<h2>Vehicle &amp; Fuel</h2><p class="lead">Vehicle hire plus an estimated fuel cost (distance × rate).</p>'
      +'<div class="grid2"><div class="fld"><label>Vehicle hire (total, N$)</label><input id="f-vehicle" type="number" min="0" value="'+(S.vehicleTotal||'')+'" placeholder="0.00"></div></div>'
      +'<div class="grid2"><div class="fld"><label>Total distance (km)</label><input id="f-fuelkm" type="number" min="0" value="'+(S.fuelKm||'')+'" placeholder="0"></div>'
      +'<div class="fld"><label>Vehicle type</label><select id="f-fueltype"><option value="2wd" '+(S.fuelType==='2wd'?'selected':'')+'>2WD / sedan (N$3.125/km)</option><option value="4wd" '+(S.fuelType==='4wd'?'selected':'')+'>4×4 (N$4.00/km)</option></select></div></div>'
      +'<div class="sec-total"><span class="lbl">Fuel estimate</span><span class="amt">'+money(fuelCost())+'</span></div>'
      +'<div class="sec-total"><span class="lbl">Vehicle + fuel</span><span class="amt">'+money(num(S.vehicleTotal)+fuelCost())+'</span></div>';
  } else if(active==='guide'){ h='<h2>Guide Costs</h2><p class="lead">Guide fees, accommodation, day rates.</p>'+liSection('guide','Guide','Guide fee / day rate'); }
  else if(active==='flights'){ h='<h2>Flights</h2><p class="lead">Scheduled or charter flight legs.</p>'+liSection('flights','Flights','Route — e.g. WDH → Sossusvlei'); }
  else if(active==='activities'){ h='<h2>Activities</h2><p class="lead">Excursions and activities outside lodge rates.</p>'+liSection('activities','Activities','Activity name'); }
  else if(active==='extras'){ h='<h2>Extras</h2><p class="lead">Park fees, transfers, anything else.</p>'+liSection('extras','Extras','Extra item'); }
  else if(active==='botswana'){ h='<h2>Botswana / Add-ons</h2><p class="lead">Cross-border lodges and add-on segments.</p>'+liSection('botswana','Botswana / add-ons','Lodge / segment'); }
  else if(active==='final'){
    var net=netTotal(),sell=net*(1+num(S.markup)/100),pax=Math.max(1,parseInt(S.adults)||1);
    function row(l,v){return '<div class="sumrow"><span>'+l+'</span><span class="v">'+money(v)+'</span></div>'}
    h='<h2>Final Pricing</h2><p class="lead">'+esc(S.name||'Untitled quote')+' &middot; '+pax+' adult'+(pax>1?'s':'')+(num(S.children)?' + '+S.children+' child':'')+'</p>'
      +row('Accommodation',accomTotal())+row('Vehicle hire',num(S.vehicleTotal))+row('Fuel',fuelCost())
      +row('Guide',sumLI(S.guide))+row('Flights',sumLI(S.flights))+row('Activities',sumLI(S.activities))
      +row('Extras',sumLI(S.extras))+row('Botswana / add-ons',sumLI(S.botswana))
      +'<div class="sumrow big"><span>Net total</span><span class="v">'+money(net)+'</span></div>'
      +'<div class="sumrow"><span>Markup ('+S.markup+'%)</span><span class="v">'+money(sell-net)+'</span></div>'
      +'<div class="sumrow big" style="color:var(--gold)"><span>Sell total</span><span class="v">'+money(sell)+'</span></div>'
      +'<div class="ppgrid"><div class="ppcard"><div class="l">Sell per adult</div><div class="n">'+money(sell/pax)+'</div></div>'
      +'<div class="ppcard"><div class="l">Net per adult</div><div class="n">'+money(net/pax)+'</div></div></div>';
  }
  p.innerHTML=h;
  bindPanel();
  renderNav();
}

function bindPanel(){
  // trip
  var x;
  if(x=document.getElementById('f-name'))x.oninput=function(){S.name=x.value;updateTotals()};
  if(x=document.getElementById('f-adults'))x.oninput=function(){S.adults=x.value;updateTotals()};
  if(x=document.getElementById('f-children'))x.oninput=function(){S.children=x.value;updateTotals()};
  if(x=document.getElementById('f-markup'))x.oninput=function(){S.markup=num(x.value);document.getElementById('t-markup').value=S.markup;updateTotals()};
  // vehicle/fuel
  if(x=document.getElementById('f-vehicle'))x.oninput=function(){S.vehicleTotal=num(x.value);updateTotals();var st=document.querySelectorAll('#panel .sec-total .amt');if(st[1])st[1].textContent=money(num(S.vehicleTotal)+fuelCost())};
  if(x=document.getElementById('f-fuelkm'))x.oninput=function(){S.fuelKm=num(x.value);renderPanel()};
  if(x=document.getElementById('f-fueltype'))x.onchange=function(){S.fuelType=x.value;renderPanel()};
  // lodges
  document.querySelectorAll('#panel select[data-f],#panel input[data-f]').forEach(function(el){
    var ev=el.tagName==='SELECT'?'onchange':'oninput';
    el[ev]=function(){
      var i=+el.dataset.i,f=el.dataset.f,d=S.lodges[i];if(!d)return;
      if(f==='region'){d.region=el.value;d.lodgeIdx=-1;d.roomIdx=-1;renderPanel();return}
      if(f==='lodgeIdx'){d.lodgeIdx=+el.value;d.roomIdx=-1;renderPanel();return}
      if(f==='roomIdx'){d.roomIdx=+el.value;renderPanel();return}
      if(f==='nights'){d.nights=Math.max(1,parseInt(el.value,10)||1);renderPanel();return}
      if(f==='pax'){d.pax=Math.max(1,parseInt(el.value,10)||1);renderPanel();return}
    };
  });
  if(x=document.getElementById('add-lodge'))x.onclick=function(){S.lodges.push({region:'',lodgeIdx:-1,roomIdx:-1,pax:parseInt(S.adults)||2,nights:2});renderPanel()};
  document.querySelectorAll('#panel [data-lodge-rm]').forEach(function(b){b.onclick=function(){S.lodges.splice(+b.dataset.lodgeRm,1);renderPanel()}});
  // line items
  document.querySelectorAll('#panel input[data-k]').forEach(function(el){
    el.oninput=function(){var k=el.dataset.k,i=+el.dataset.i,f=el.dataset.f;if(S[k][i])S[k][i][f]=(f==='amount'?el.value:el.value);updateTotals();
      var st=document.querySelector('#panel .sec-total .amt');if(st)st.textContent=money(sumLI(S[k]))};
  });
  document.querySelectorAll('#panel [data-add]').forEach(function(b){b.onclick=function(){S[b.dataset.add].push({name:'',amount:''});renderPanel()}});
  document.querySelectorAll('#panel .rm[data-k]').forEach(function(b){b.onclick=function(){S[b.dataset.k].splice(+b.dataset.i,1);renderPanel()}});
  updateTotals();
}

document.getElementById('t-markup').addEventListener('input',function(){S.markup=num(this.value);updateTotals()});

/* ---- saved quotes (this browser) ---- */
var QK='nr_saved_quotes';
function loadQ(){try{return JSON.parse(localStorage.getItem(QK))||[]}catch(e){return[]}}
function saveQ(a){try{localStorage.setItem(QK,JSON.stringify(a))}catch(e){}}
document.getElementById('btn-save').addEventListener('click',function(){
  var nm=prompt('Name this quote:',S.name||('Quote '+new Date().toLocaleDateString('en-GB')));if(!nm)return;
  var a=loadQ();a.unshift({id:'q'+Date.now(),name:nm.trim(),savedAt:new Date().toISOString(),state:JSON.parse(JSON.stringify(S))});
  saveQ(a);alert('Saved: '+nm.trim());
});
document.getElementById('btn-saved').addEventListener('click',function(){
  var a=loadQ();if(!a.length){alert('No saved quotes yet.');return}
  var list=a.map(function(x,i){return (i+1)+'. '+x.name+'  ('+(x.savedAt||'').split('T')[0]+')'}).join('\n');
  var pick=prompt('Saved quotes — number to LOAD (or d+number to delete):\n\n'+list);if(!pick)return;pick=pick.trim();
  if(/^d\s*\d+$/i.test(pick)){var di=parseInt(pick.replace(/[^0-9]/g,''),10)-1;if(a[di]){a.splice(di,1);saveQ(a);alert('Deleted.')}return}
  var idx=parseInt(pick,10)-1;if(a[idx]){S=Object.assign(S,a[idx].state);document.getElementById('t-markup').value=S.markup;active='final';renderNav();renderPanel();alert('Loaded: '+a[idx].name)}
});

/* ---- load rates + seed from the card itinerary ---- */
fetch('/assets/rates-index.json').then(function(r){return r.json()}).then(function(j){RATES=j;seed();start()}).catch(function(){start()});
function seed(){
  try{
    var it=JSON.parse(sessionStorage.getItem('nr_itinerary'))||[];
    it.forEach(function(x){
      var li=-1;for(var k=0;k<RATES.lodges.length;k++){if(RATES.lodges[k].name.toLowerCase()===(x.name||'').toLowerCase()){li=k;break}}
      var nights=(x.items&&x.items[0]&&x.items[0].nights)||x.nights||2;
      S.lodges.push({region:li>-1?RATES.lodges[li].region:'',lodgeIdx:li,roomIdx:-1,pax:parseInt(S.adults)||2,nights:nights});
    });
    if(it.length) active='lodges';
  }catch(e){}
}
function start(){renderNav();renderPanel();}
</script>
</body>
