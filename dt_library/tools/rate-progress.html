function actCell(r){if(r.acts==null||r.acts===0)return '<span style="color:#c9c2b8">—</span>';return '<span class="pill act" title="'+r.acts+' optional activit'+(r.acts>1?'ies':'y')+'">'+r.acts+' ᴬ</span>';}
function sheetCell(r){if(r.origpdf)return '<a href="'+r.origpdf+'" target="_blank" rel="noopener" title="Original supplier rate sheet (PDF)" style="color:#7a8a72;text-decoration:none;white-space:nowrap">PDF ↗</a>';return '<span style="color:#c9c2b8">—</span>';}
function tiles(rows){var t=rows.length;var s={sto26:rows.filter(function(r){return r.sto26;}).length,rack26:rows.filter(function(r){return r.rack26===true;}).length,sto27:rows.filter(function(r){return r.sto27;}).length,rack27:rows.filter(function(r){return r.rack27===true;}).length};function pct(n){return t?Math.round(100*n/t):0;}function tile(lbl,n,p){return '<div class="tile"><div class="n">'+n+' <span class="pct">'+p+'%</span></div>'+'<div class="l">'+lbl+'</div><div class="bar"><i style="width:'+p+'%"></i></div></div>';}document.getElementById('tiles').innerHTML='<div class="tile total"><div class="n">'+t+'</div><div class="l">Items tracked</div></div>'+'<div class="grp grp26"><div class="grp-h">2026 Season</div><div class="grp-tiles">'+tile('STO rate sheet',s.sto26,pct(s.sto26))+tile('Rack (verified)',s.rack26,pct(s.rack26))+'</div></div>'+'<div class="grp grp27"><div class="grp-h">2027 Season</div><div class="grp-tiles">'+tile('STO rate sheet',s.sto27,pct(s.sto27))+tile('Rack (verified)',s.rack27,pct(s.rack27))+'</div></div>'+mediaGrp(rows);}
function mediaGrp(rows){var matched=rows.filter(function(r){return r.photos!=null;});if(!matched.length&&!rows.some(function(r){return r.acts!=null;}))return '';var haveP=matched.filter(function(r){return r.photos>0;}).length;var needP=matched.filter(function(r){return r.photos===0;}).length;var withA=rows.filter(function(r){return r.acts>0;}).length;var mt=matched.length||1;function pt(n){return Math.round(100*n/mt);}function tl(lbl,n,p,bar){return '<div class="tile"><div class="n">'+n+(p!=null?' <span class="pct">'+p+'%</span>':'')+'</div><div class="l">'+lbl+'</div>'+(bar?'<div class="bar"><i style="width:'+p+'%"></i></div>':'')+'</div>';}return '<div class="grp grpm"><div class="grp-h">Media &amp; Activities</div><div class="grp-tiles">'+tl('Photos loaded',haveP,pt(haveP),true)+tl('Need photos',needP,null,false)+tl('Offer activities',withA,null,false)+'</div></div>';}
let sortK='lodge',sortDir=1;
function render(){
 const q=document.getElementById('q').value.toLowerCase();
 const rg=document.getElementById('region').value;
 const st=document.getElementById('status').value;
 const cat=document.getElementById('category').value;
 let rows=DATA.rows.filter(r=>{
   if(q&&!r.lodge.toLowerCase().includes(q))return false;
   if(cat&&r.category!==cat)return false;
   if(rg&&r.region!==rg)return false;
   if(st==='need27sto'&&r.sto27)return false;
   if(st==='need27rack'&&r.rack27===true)return false;
   if(st==='need26sto'&&r.sto26)return false;
   if(st==='done27'&&!r.sto27)return false;
   if(st==='high'&&r.confidence!=='high')return false;
   if(st==='needphoto'&&r.photos!==0)return false;
   if(st==='hasphoto'&&!(r.photos>0))return false;
   if(st==='hasact'&&!(r.acts>0))return false;
   return true;
 });
 rows.sort((a,b)=>{let x=a[sortK],y=b[sortK];x=x===null?-1:x;y=y===null?-1:y;if(x<y)return -sortDir;if(x>y)return sortDir;return 0;});
 document.getElementById('tb').innerHTML=rows.map(r=>`<tr>
  <td>${r.lodge}${r.type==='collection'?'<span class="type">collection</span>':''}${r.category&&r.category!=='Lodge'?'<span class="type">'+r.category+'</span>':''}</td>
  <td>${r.region||'<span style="color:#b9b1a9">—</span>'}</td>
  <td class="cell">${dot(r.sto26)}</td><td class="cell">${dot(r.rack26)}</td>
  <td class="cell">${dot(r.sto27)}</td><td class="cell">${dot(r.rack27)}</td>
  <td class="cell">${photoCell(r)}</td><td class="cell">${actCell(r)}</td>
  <td><span class="conf ${r.confidence}">${r.confidence}</span></td>
  <td class="notes">${r.notes||''}</td>
  <td class="cell">${sheetCell(r)}</td></tr>`).join('');
 tiles(rows);
 document.getElementById('count').textContent=rows.length+' of '+DATA.rows.length+' shown';
}
(function(){const regs=[...new Set(DATA.rows.filter(r=>r.category==='Lodge').map(r=>r.region).filter(Boolean))].sort();
 const sel=document.getElementById('region');regs.forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;sel.appendChild(o);});
 document.querySelectorAll('th[data-k]').forEach(th=>th.addEventListener('click',()=>{const k=th.dataset.k;if(sortK===k)sortDir*=-1;else{sortK=k;sortDir=1;}render();}));
 ['q','region','status','category'].forEach(id=>document.getElementById(id).addEventListener('input',render));
 render();
 // enrich with live photo + activity counts from the data files
 Promise.all([
   fetch('/assets/lodges-info.json').then(function(r){return r.json();}).catch(function(){return {};}),
   fetch('/assets/rates-index.json').then(function(r){return r.json();}).catch(function(){return {lodges:[]};})
 ]).then(function(res){
   var li=res[0]||{}, idx=res[1]||{lodges:[]}, LI={}, ACT={};
   Object.keys(li).forEach(function(k){var e=li[k];LI[k]=(e&&e.imgs&&e.imgs.length)||0;});
   (idx.lodges||[]).forEach(function(L){var seen={},c=0;[].concat(L.rates||[],L.rates_2027||[]).forEach(function(rt){if(rt&&(isActivity(rt.n)||rt.a)&&!seen[rt.n]){seen[rt.n]=1;c++;}});ACT[normn(L.name)]=c;});
   DATA.rows.forEach(function(r){var k=normn(r.lodge);var isProp=(r.type==='lodge');r.photos=(k in LI)?LI[k]:(isProp?0:null);r.acts=(k in ACT)?ACT[k]:null;var _e=li[k]||{};r.origimg=_e.shot||'';r.origpdf=_e.orig||'';});
   render();
 });
})();
</script><script>(function(){function ss(){var tb=document.querySelector(".topbar");if(tb){var h=Math.round(tb.getBoundingClientRect().height);document.documentElement.style.setProperty("--stick",h+"px");}}ss();window.addEventListener("load",ss);window.addEventListener("resize",ss);document.addEventListener("DOMContentLoaded",ss);try{var tb=document.querySelector(".topbar");if(tb&&window.ResizeObserver)new ResizeObserver(ss).observe(tb);}catch(e){}[50,150,400,900].forEach(function(t){setTimeout(ss,t);});})();</script>
